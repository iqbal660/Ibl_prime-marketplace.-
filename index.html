<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>LUXE NOIR | Premium Gold Collection</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Manrope', sans-serif; background: #0a0a0a; color: #e5e5e5; }
        :root { --gold: #D4AF37; --gold-dark: #B8960C; --gold-light: #F5E18C; --black: #050505; --black-card: #1a1a1a; --gray: #2a2a2a; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--black); }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }
        .discount-notification { position: fixed; top: 20px; right: 20px; background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: var(--black); padding: 1rem 1.5rem; border-radius: 12px; font-weight: bold; z-index: 1000; animation: slideIn 0.5s ease, fadeOut 0.5s ease 4.5s forwards; box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3); font-family: 'Playfair Display', serif; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
        .header { background: var(--black); border-bottom: 2px solid var(--gold); padding: 1rem 2rem; position: sticky; top: 0; z-index: 100; }
        .header-content { max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 800; background: linear-gradient(135deg, var(--gold), var(--gold-light)); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: 2px; }
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-links a { color: #e5e5e5; text-decoration: none; font-weight: 500; transition: 0.3s; cursor: pointer; }
        .nav-links a:hover, .nav-links a.active { color: var(--gold); }
        .cart-icon { position: relative; cursor: pointer; font-size: 1.5rem; color: var(--gold); }
        .cart-count { position: absolute; top: -10px; right: -12px; background: var(--gold); color: var(--black); font-size: 0.7rem; font-weight: bold; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .hero { background: linear-gradient(135deg, #0a0a0a 0%, #1a1a0a 100%); padding: 5rem 2rem; text-align: center; border-bottom: 1px solid var(--gold); }
        .hero h1 { font-family: 'Playfair Display', serif; font-size: 3.5rem; color: var(--gold); }
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        .filters { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 2rem; justify-content: space-between; }
        .search-box { flex: 1; max-width: 300px; }
        .search-box input { width: 100%; padding: 0.8rem; background: var(--black-card); border: 1px solid var(--gray); border-radius: 8px; color: white; font-family: 'Manrope', sans-serif; }
        .category-pills { display: flex; flex-wrap: wrap; gap: 0.8rem; }
        .pill { background: var(--black-card); padding: 0.5rem 1.2rem; border-radius: 50px; cursor: pointer; transition: 0.3s; border: 1px solid var(--gray); font-size: 0.9rem; }
        .pill.active, .pill:hover { background: var(--gold); color: var(--black); border-color: var(--gold); }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2rem; }
        .product-card { background: var(--black-card); border-radius: 16px; overflow: hidden; transition: 0.3s; border: 1px solid var(--gray); position: relative; }
        .product-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(212, 175, 55, 0.15); border-color: var(--gold); }
        .product-badge { position: absolute; top: 10px; left: 10px; background: var(--gold); color: var(--black); padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.75rem; font-weight: bold; z-index: 2; }
        .product-images { position: relative; height: 280px; overflow: hidden; }
        .main-img { width: 100%; height: 100%; object-fit: cover; transition: 0.3s; }
        .thumbnail-strip { display: flex; gap: 5px; padding: 8px; background: rgba(0,0,0,0.8); position: absolute; bottom: 0; left: 0; right: 0; }
        .thumb { width: 50px; height: 50px; object-fit: cover; cursor: pointer; border: 2px solid transparent; border-radius: 4px; }
        .thumb:hover { border-color: var(--gold); }
        .product-info { padding: 1.2rem; }
        .product-title { font-family: 'Playfair Display', serif; font-size: 1.2rem; margin-bottom: 0.5rem; }
        .product-price { color: var(--gold); font-size: 1.3rem; font-weight: bold; margin: 0.5rem 0; }
        .product-desc { font-size: 0.85rem; color: #aaa; margin-bottom: 1rem; line-height: 1.4; }
        .cart-controls { display: flex; gap: 0.5rem; align-items: center; }
        .qty-btn { background: var(--gray); border: none; width: 36px; height: 36px; border-radius: 8px; color: white; cursor: pointer; font-weight: bold; font-size: 1.1rem; }
        .add-to-cart { flex: 1; background: var(--gold); color: var(--black); border: none; padding: 0.6rem; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .add-to-cart:hover { background: var(--gold-dark); }
        .wishlist { background: none; border: none; color: #aaa; font-size: 1.3rem; cursor: pointer; transition: 0.3s; }
        .wishlist.active { color: var(--gold); }
        .cart-overlay { position: fixed; top: 0; right: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; display: none; justify-content: flex-end; }
        .cart-drawer { width: 100%; max-width: 450px; background: var(--black-card); height: 100%; display: flex; flex-direction: column; border-left: 2px solid var(--gold); }
        .cart-header { padding: 1.5rem; border-bottom: 1px solid var(--gray); display: flex; justify-content: space-between; align-items: center; }
        .cart-items { flex: 1; overflow-y: auto; padding: 1rem; }
        .cart-item { display: flex; gap: 1rem; padding: 1rem; border-bottom: 1px solid var(--gray); }
        .cart-item-img { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; }
        .cart-item-details { flex: 1; }
        .cart-item-details strong { font-family: 'Playfair Display', serif; }
        .cart-item-controls { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
        .cart-item-controls button { background: var(--gray); border: none; width: 28px; height: 28px; border-radius: 6px; color: white; cursor: pointer; }
        .cart-footer { padding: 1.5rem; border-top: 1px solid var(--gray); }
        .total { font-size: 1.3rem; margin-bottom: 1rem; font-weight: bold; }
        .total span { color: var(--gold); }
        .checkout-btn { width: 100%; background: var(--gold); color: var(--black); padding: 1rem; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.3s; }
        .checkout-btn:hover { background: var(--gold-dark); }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; display: none; align-items: center; justify-content: center; }
        .modal-content { background: var(--black-card); max-width: 500px; width: 90%; padding: 2rem; border-radius: 20px; border: 1px solid var(--gold); }
        .modal-content h3 { color: var(--gold); margin-bottom: 1rem; }
        .modal-content input, .modal-content textarea { width: 100%; padding: 0.8rem; margin: 0.5rem 0; background: var(--black); border: 1px solid var(--gray); color: white; border-radius: 8px; font-family: 'Manrope', sans-serif; }
        .modal-content button { margin-top: 0.5rem; }
        .dashboard { padding: 2rem; max-width: 1400px; margin: 0 auto; }
        .product-form { background: var(--black-card); padding: 2rem; border-radius: 16px; margin-bottom: 2rem; border: 1px solid var(--gray); }
        .product-form h3 { color: var(--gold); margin-bottom: 1rem; }
        .product-form input, .product-form textarea { width: 100%; padding: 0.8rem; margin: 0.5rem 0; background: var(--black); border: 1px solid var(--gray); color: white; border-radius: 8px; font-family: 'Manrope', sans-serif; }
        .image-input-group { display: flex; gap: 1rem; flex-wrap: wrap; margin: 0.5rem 0; }
        .image-input-group input { flex: 1; min-width: 120px; }
        .btn-gold { background: var(--gold); color: var(--black); padding: 0.8rem 1.5rem; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-gold:hover { background: var(--gold-dark); }
        .products-table { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--gray); }
        th { color: var(--gold); font-weight: 600; }
        .delete-btn { background: #ff4444; color: white; border: none; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; }
        .floating-cart { position: fixed; bottom: 20px; right: 20px; background: var(--gold); width: 55px; height: 55px; border-radius: 50%; display: none; align-items: center; justify-content: center; cursor: pointer; z-index: 99; box-shadow: 0 5px 20px rgba(212,175,55,0.4); }
        .floating-cart i { color: var(--black); font-size: 1.5rem; }
        @media (max-width: 768px) { .floating-cart { display: flex; } .cart-icon.desktop { display: none; } .product-grid { grid-template-columns: 1fr; } .hero h1 { font-size: 2rem; } .container { padding: 1rem; } }
        .empty-cart { text-align: center; padding: 2rem; color: #888; }
        .remove-item { background: #ff4444 !important; }
    </style>
</head>
<body>
    <div id="discountNotification" class="discount-notification" style="display: none;">✨ Welcome! 15% OFF on first order ✨</div>
    
    <header class="header">
        <div class="header-content">
            <div class="logo">LUXE<span style="color:var(--gold)">NOIR</span></div>
            <div class="nav-links">
                <a onclick="showPage('shop')" class="active" id="navShop">Shop</a>
                <a onclick="showPage('dashboard')" id="navDashboard">Seller Dashboard</a>
                <div class="cart-icon desktop" onclick="openCart()">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="cart-count" id="cartCountDesktop">0</span>
                </div>
            </div>
        </div>
    </header>
    
    <div id="shopPage">
        <section class="hero">
            <h1>Timeless Elegance</h1>
            <p style="margin-top: 1rem;">Discover the Gold Standard in Luxury</p>
        </section>
        <div class="container">
            <div class="filters">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search products..." onkeyup="updateSearch()">
                </div>
                <div class="category-pills" id="categoryPills"></div>
            </div>
            <div class="product-grid" id="productGrid"></div>
        </div>
    </div>
    
    <div id="dashboardPage" style="display: none;">
        <div class="dashboard">
            <h2 style="color: var(--gold); margin-bottom: 1.5rem;">📊 Seller Dashboard</h2>
            <div class="product-form">
                <h3>➕ Add New Product</h3>
                <input type="text" id="prodName" placeholder="Product Name">
                <textarea id="prodDesc" placeholder="Description" rows="2"></textarea>
                <input type="number" id="prodPrice" placeholder="Price (USD)">
                <div class="image-input-group">
                    <input type="text" id="img1" placeholder="Image URL 1">
                    <input type="text" id="img2" placeholder="Image URL 2">
                    <input type="text" id="img3" placeholder="Image URL 3">
                </div>
                <input type="text" id="prodCategory" placeholder="Category (e.g., Watches, Bags, Jewelry)">
                <button class="btn-gold" onclick="addProduct()">✨ Add Product</button>
            </div>
            <div class="products-table">
                <h3 style="margin-bottom: 1rem;">📦 Manage Products (Unlimited)</h3>
                <table id="productsTable">
                    <thead><tr><th>Image</th><th>Name</th><th>Price</th><th>Category</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
    
    <div id="cartOverlay" class="cart-overlay" onclick="if(event.target===this) closeCart()">
        <div class="cart-drawer">
            <div class="cart-header">
                <h3><i class="fas fa-shopping-bag"></i> Your Cart</h3>
                <i class="fas fa-times" onclick="closeCart()" style="cursor:pointer; font-size:1.2rem;"></i>
            </div>
            <div class="cart-items" id="cartItemsList"></div>
            <div class="cart-footer">
                <div class="total">Total: $<span id="cartTotal">0</span></div>
                <button class="checkout-btn" onclick="requestAddress()"><i class="fab fa-whatsapp"></i> Order via WhatsApp</button>
            </div>
        </div>
    </div>
    
    <div id="addressModal" class="modal">
        <div class="modal-content">
            <h3>📦 Delivery Information</h3>
            <input type="text" id="customerName" placeholder="Full Name">
            <input type="text" id="customerPhone" placeholder="Phone Number">
            <textarea id="customerAddress" rows="3" placeholder="Full Address (Street, City, Pin Code)"></textarea>
            <button class="btn-gold" onclick="sendWhatsAppOrder()">Confirm & Send to WhatsApp</button>
            <button onclick="closeAddressModal()" style="margin-top:10px; background:#333; color:white; padding:0.6rem; width:100%; border:none; border-radius:8px; cursor:pointer;">Cancel</button>
        </div>
    </div>
    
    <div class="floating-cart" onclick="openCart()">
        <i class="fas fa-shopping-bag"></i>
        <span class="cart-count" id="cartCountMobile">0</span>
    </div>

    <script>
        // ============ PRODUCT DATABASE (Unlimited) ============
        let products = JSON.parse(localStorage.getItem('luxe_products')) || [
            { id: 1, name: "Golden Chronograph", desc: "Swiss movement, 18k gold plating. Water resistant 50m.", price: 499, category: "Watches", images: ["https://picsum.photos/id/82/400/400", "https://picsum.photos/id/83/400/400", "https://picsum.photos/id/84/400/400"], wishlist: false },
            { id: 2, name: "Onyx Leather Bag", desc: "Handcrafted Italian leather with gold hardware.", price: 799, category: "Bags", images: ["https://picsum.photos/id/20/400/400", "https://picsum.photos/id/21/400/400", "https://picsum.photos/id/22/400/400"], wishlist: false },
            { id: 3, name: "Royal Cufflinks", desc: "Gold & Black Enamel. Perfect for formal events.", price: 199, category: "Jewelry", images: ["https://picsum.photos/id/36/400/400", "https://picsum.photos/id/37/400/400", "https://picsum.photos/id/38/400/400"], wishlist: false },
            { id: 4, name: "Midnight Sunglasses", desc: "Polarized lenses with gold frame.", price: 299, category: "Accessories", images: ["https://picsum.photos/id/96/400/400", "https://picsum.photos/id/95/400/400", "https://picsum.photos/id/94/400/400"], wishlist: false },
            { id: 5, name: "Gold Pen Set", desc: "Limited edition rollerball pen.", price: 149, category: "Accessories", images: ["https://picsum.photos/id/28/400/400", "https://picsum.photos/id/29/400/400", "https://picsum.photos/id/30/400/400"], wishlist: false }
        ];
        
        let cart = JSON.parse(localStorage.getItem('luxe_cart')) || [];
        let currentPage = 'shop';
        let currentFilter = 'all';
        let searchTerm = '';

        // ============ SAVE FUNCTIONS ============
        function saveProducts() { 
            localStorage.setItem('luxe_products', JSON.stringify(products)); 
            renderShop(); 
            renderDashboard();
            updateCategoryPills();
        }
        
        function saveCart() { 
            localStorage.setItem('luxe_cart', JSON.stringify(cart)); 
            updateCartUI(); 
        }

        // ============ PRODUCT CRUD ============
        function addProduct() {
            let name = document.getElementById('prodName').value.trim();
            let desc = document.getElementById('prodDesc').value.trim();
            let price = parseFloat(document.getElementById('prodPrice').value);
            let img1 = document.getElementById('img1').value.trim() || "https://picsum.photos/id/26/400/400";
            let img2 = document.getElementById('img2').value.trim() || img1;
            let img3 = document.getElementById('img3').value.trim() || img1;
            let category = document.getElementById('prodCategory').value.trim() || "Uncategorized";
            
            if(!name || isNaN(price) || price <= 0) { 
                alert("❌ Please fill Name and valid Price"); 
                return; 
            }
            
            let newId = Date.now();
            products.push({ 
                id: newId, 
                name: name, 
                desc: desc || "Premium luxury product", 
                price: price, 
                category: category, 
                images: [img1, img2, img3], 
                wishlist: false 
            });
            saveProducts();
            
            // Clear form
            document.getElementById('prodName').value = '';
            document.getElementById('prodDesc').value = '';
            document.getElementById('prodPrice').value = '';
            document.getElementById('img1').value = '';
            document.getElementById('img2').value = '';
            document.getElementById('img3').value = '';
            document.getElementById('prodCategory').value = '';
            
            alert("✅ Product added successfully!");
        }

        function deleteProduct(id) {
            if(confirm("Delete this product?")) {
                products = products.filter(p => p.id !== id);
                saveProducts();
            }
        }

        function toggleWishlist(id) {
            let p = products.find(p => p.id === id);
            if(p) p.wishlist = !p.wishlist;
            saveProducts();
        }

        // ============ CART FUNCTIONS ============
        function addToCart(productId, qty = 1) {
            let product = products.find(p => p.id === productId);
            if(!product) return;
            let existing = cart.find(i => i.id === productId);
            if(existing) {
                existing.qty += qty;
            } else {
                cart.push({ id: productId, name: product.name, price: product.price, qty: qty, image: product.images[0] });
            }
            saveCart();
            // Visual feedback
            let btn = event?.target;
            if(btn && btn.classList) {
                btn.style.background = "#B8960C";
                setTimeout(() => { if(btn) btn.style.background = ""; }, 200);
            }
        }

        function updateCartItem(id, newQty) {
            if(newQty <= 0) {
                cart = cart.filter(i => i.id !== id);
            } else {
                let item = cart.find(i => i.id === id);
                if(item) item.qty = newQty;
            }
            saveCart();
        }

        function updateCartUI() {
            let count = cart.reduce((s, i) => s + i.qty, 0);
            document.getElementById('cartCountDesktop').innerText = count;
            document.getElementById('cartCountMobile').innerText = count;
            renderCartDrawer();
        }

        function renderCartDrawer() {
            let container = document.getElementById('cartItemsList');
            if(!container) return;
            if(cart.length === 0) {
                container.innerHTML = '<div class="empty-cart"><i class="fas fa-shopping-bag" style="font-size:3rem; margin-bottom:1rem; opacity:0.5"></i><br>Your cart is empty</div>';
                document.getElementById('cartTotal').innerText = '0';
                return;
            }
            let html = '';
            let total = 0;
            cart.forEach(item => {
                total += item.price * item.qty;
                html += `
                    <div class="cart-item">
                        <img class="cart-item-img" src="${item.image}" alt="${item.name}">
                        <div class="cart-item-details">
                            <strong>${item.name}</strong><br>
                            <span style="color: var(--gold);">$${item.price}</span>
                            <div class="cart-item-controls">
                                <button onclick="updateCartItem(${item.id}, ${item.qty - 1})">-</button>
                                <span style="min-width: 30px; text-align: center;">${item.qty}</span>
                                <button onclick="updateCartItem(${item.id}, ${item.qty + 1})">+</button>
                                <button class="remove-item" onclick="updateCartItem(${item.id}, 0)"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            document.getElementById('cartTotal').innerText = total.toFixed(2);
        }

        // ============ RENDER SHOP ============
        function renderShop() {
            let filtered = products.filter(p => {
                let matchCategory = currentFilter === 'all' || p.category === currentFilter;
                let matchSearch = p.name.toLowerCase().includes(searchTerm.toLowerCase()) || p.desc.toLowerCase().includes(searchTerm.toLowerCase());
                return matchCategory && matchSearch;
            });
            let grid = document.getElementById('productGrid');
            if(!grid) return;
            if(filtered.length === 0) {
                grid.innerHTML = '<div style="text-align:center; padding:3rem; color:#888;">✨ No products found. Add some from Seller Dashboard!</div>';
                return;
            }
            grid.innerHTML = filtered.map(p => `
                <div class="product-card">
                    <div class="product-badge">${p.wishlist ? '❤️ Wishlist' : '✨ New'}</div>
                    <div class="product-images">
                        <img class="main-img" id="mainImg-${p.id}" src="${p.images[0]}">
                        <div class="thumbnail-strip">
                            ${p.images.map((img, idx) => `<img class="thumb" src="${img}" onclick="document.getElementById('mainImg-${p.id}').src='${img}'">`).join('')}
                        </div>
                    </div>
                    <div class="product-info">
                        <div class="product-title">${p.name}</div>
                        <div class="product-desc">${p.desc.substring(0, 80)}${p.desc.length > 80 ? '...' : ''}</div>
                        <div class="product-price">$${p.price}</div>
                        <div class="cart-controls">
                            <button class="qty-btn" onclick="addToCart(${p.id}, 1)">+</button>
                            <button class="add-to-cart" onclick="addToCart(${p.id}, 1)">Add to Cart</button>
                            <button class="wishlist ${p.wishlist ? 'active' : ''}" onclick="toggleWishlist(${p.id})"><i class="fas fa-heart"></i></button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updateCategoryPills() {
            let categories = ['all', ...new Set(products.map(p => p.category))];
            let container = document.getElementById('categoryPills');
            if(!container) return;
            container.innerHTML = categories.map(c => `
                <div class="pill ${currentFilter === c ? 'active' : ''}" onclick="setFilter('${c}')">
                    ${c} (${products.filter(p => c === 'all' || p.category === c).length})
                </div>
            `).join('');
        }

        function setFilter(cat) { 
            currentFilter = cat; 
            renderShop(); 
            updateCategoryPills();
        }
        
        function updateSearch() {
            searchTerm = document.getElementById('searchInput').value;
            renderShop();
        }

        // ============ DASHBOARD ============
        function renderDashboard() {
            let tbody = document.getElementById('tableBody');
            if(!tbody) return;
            if(products.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No products yet. Add your first product above!</td></tr>';
                return;
            }
            tbody.innerHTML = products.map(p => `
                <tr>
                    <td><img src="${p.images[0]}" width="50" height="50" style="border-radius: 8px; object-fit: cover;"></td>
                    <td><strong>${p.name}</strong><br><small style="color:#888;">${p.desc.substring(0, 40)}...</small></td>
                    <td style="color: var(--gold);">$${p.price}</td>
                    <td><span style="background:var(--gray); padding:0.2rem 0.6rem; border-radius:20px; font-size:0.8rem;">${p.category}</span></td>
                    <td><button class="delete-btn" onclick="deleteProduct(${p.id})"><i class="fas fa-trash"></i> Delete</button></td>
                </tr>
            `).join('');
        }

        // ============ PAGE NAVIGATION ============
        function showPage(page) {
            currentPage = page;
            document.getElementById('shopPage').style.display = page === 'shop' ? 'block' : 'none';
            document.getElementById('dashboardPage').style.display = page === 'dashboard' ? 'block' : 'none';
            
            document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
            if(page === 'shop') document.getElementById('navShop').classList.add('active');
            else document.getElementById('navDashboard').classList.add('active');
            
            if(page === 'dashboard') renderDashboard();
            else renderShop();
        }

        // ============ CART DRAWER ============
        function openCart() { 
            document.getElementById('cartOverlay').style.display = 'flex'; 
            renderCartDrawer();
        }
        function closeCart() { document.getElementById('cartOverlay').style.display = 'none'; }

        // ============ WHATSAPP ORDER ============
        function requestAddress() { 
            if(cart.length === 0) { 
                alert("🛒 Your cart is empty! Add some products first."); 
                return; 
            }
            document.getElementById('addressModal').style.display = 'flex'; 
        }
        
        function closeAddressModal() { document.getElementById('addressModal').style.display = 'none'; }
        
        function sendWhatsAppOrder() {
            let name = document.getElementById('customerName').value.trim();
            let phone = document.getElementById('customerPhone').value.trim();
            let address = document.getElementById('customerAddress').value.trim();
            
            if(!name || !phone || !address) { 
                alert("❌ Please fill all address fields"); 
                return; 
            }
            
            let orderDetails = cart.map(i => `  • ${i.name} x${i.qty} = $${(i.price * i.qty).toFixed(2)}`).join('\n');
            let total = cart.reduce((s,i) => s + (i.price * i.qty), 0);
            
            let message = `🛍️ *NEW ORDER - LUXE NOIR* 🛍️%0A%0A👤 *Customer:* ${name}%0A📞 *Phone:* ${phone}%0A📍 *Address:* ${address}%0A%0A📦 *ORDER DETAILS:*%0A${orderDetails}%0A%0A💰 *TOTAL AMOUNT:* $${total.toFixed(2)}%0A%0A🙏 Thank you for shopping at LUXE NOIR!`;
            
            window.open(`https://wa.me/1234567890?text=${message}`, '_blank');
            
            closeAddressModal();
            cart = [];
            saveCart();
            closeCart();
            alert("✅ Order sent! Our team will contact you shortly on WhatsApp.");
        }

        // ============ FIRST VISIT NOTIFICATION ============
        if(!localStorage.getItem('visited_luxe')) { 
            let notif = document.getElementById('discountNotification');
            notif.style.display = 'block';
            localStorage.setItem('visited_luxe', 'true');
            setTimeout(() => { notif.style.display = 'none'; }, 5000);
        }

        // ============ INITIALIZE ============
        function init() {
            renderShop();
            updateCategoryPills();
            updateCartUI();
            showPage('shop');
        }
        init();
    </script>
</body>
  </html>
